<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111214">
<title>Omnitone Web</title>
<style>
  :root { color-scheme: dark; --bg:#111214; --panel:#18191c; --edge:#303238; --text:#ecebe8; --dim:#95979d; --accent:#ff6a3d; --green:#63d79a; }
  * { box-sizing:border-box; }
  body { min-width:320px; min-height:100vh; margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Segoe UI",system-ui,sans-serif; }
  button, select, input { font:inherit; }
  .shell { width:min(1120px,100%); min-height:100vh; margin:auto; padding:0 24px; display:flex; flex-direction:column; }
  header { min-height:72px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--edge); }
  .brand { display:flex; align-items:center; gap:11px; font-size:14px; font-weight:750; letter-spacing:.18em; }
  .mark { width:18px; height:18px; border:2px solid var(--accent); border-radius:50%; position:relative; }
  .mark::after { content:""; position:absolute; inset:4px; background:var(--accent); border-radius:50%; }
  .edition { color:var(--dim); font-size:12px; letter-spacing:.08em; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:44px 0 32px; }
  .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:30px; }
  .eyebrow { margin:0 0 8px; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.16em; }
  h1 { margin:0; font-size:clamp(28px,5vw,42px); line-height:1.12; font-weight:650; }
  .summary { margin:10px 0 0; color:var(--dim); max-width:530px; }
  .state { flex:none; display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; }
  .state i { width:8px; height:8px; border-radius:50%; background:#5d6066; }
  .state.ready i { background:var(--green); box-shadow:0 0 10px #63d79a66; }
  .controls { display:grid; grid-template-columns:minmax(220px,1fr) auto minmax(180px,260px); align-items:end; gap:18px; padding:18px 0; border-top:1px solid var(--edge); border-bottom:1px solid var(--edge); }
  label { display:grid; gap:7px; color:var(--dim); font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
  select { width:100%; min-height:46px; padding:0 42px 0 14px; border:1px solid var(--edge); border-radius:4px; background:var(--panel); color:var(--text); }
  select:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sustain { min-height:46px; display:flex; align-items:center; gap:10px; padding:0 12px; border:1px solid var(--edge); border-radius:4px; color:var(--text); font-size:13px; letter-spacing:0; text-transform:none; cursor:pointer; }
  .sustain input { accent-color:var(--accent); width:17px; height:17px; margin:0; }
  .volume { display:flex; align-items:center; gap:12px; min-height:46px; }
  .volume input { flex:1; accent-color:var(--accent); min-width:60px; }
  .volume output { width:38px; color:var(--text); font-size:12px; text-align:right; }
  .keyboard-wrap { margin-top:34px; }
  .keyboard-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; color:var(--dim); font-size:12px; }
  .keyboard-head strong { color:var(--text); font-weight:600; }
  .keyboard { position:relative; display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); height:clamp(170px,34vh,300px); overflow:hidden; border:1px solid #08090b; border-radius:3px; background:#07080a; touch-action:none; user-select:none; }
  .key { position:relative; min-width:0; height:100%; padding:0 0 11px; display:flex; align-items:flex-end; justify-content:center; border:0; border-right:1px solid #b7b5b0; border-radius:0; background:linear-gradient(90deg,#d9d7d2,#f0eee9 50%,#d0cec9); color:#55575c; font-size:11px; cursor:pointer; touch-action:none; }
  .key:last-of-type { border-right:0; }
  .key.active { background:linear-gradient(90deg,#e95831,#ff8158 50%,#e95831); color:#171719; }
  .key.black { position:absolute; z-index:2; top:0; height:61%; width:4.43%; transform:translateX(-50%); padding:0 0 8px; border:1px solid #050506; border-radius:0 0 3px 3px; background:linear-gradient(90deg,#111214,#27282b 55%,#111214); color:#9b9da2; box-shadow:0 3px 5px #0008; }
  .key.black.active { background:linear-gradient(90deg,#b74729,#ff6a3d 55%,#b74729); color:#151517; }
  .key:focus-visible { z-index:3; outline-offset:-3px; }
  .hint { display:flex; justify-content:space-between; gap:14px; margin-top:12px; color:var(--dim); font-size:12px; }
  footer { display:flex; justify-content:space-between; gap:16px; padding:20px 0 22px; border-top:1px solid var(--edge); color:var(--dim); font-size:12px; }
  footer a { color:var(--text); text-decoration-color:var(--accent); text-underline-offset:3px; }
  @media (max-width:700px) {
    .shell { padding:0 16px; }
    .intro { align-items:flex-start; flex-direction:column; gap:14px; margin-bottom:22px; }
    .controls { grid-template-columns:1fr 1fr; gap:12px; }
    .controls > label:first-child { grid-column:1 / -1; }
    .volume { grid-column:1 / -1; }
    .keyboard-wrap { margin-top:26px; }
    .keyboard { height:clamp(180px,38vh,250px); }
    .hint { flex-direction:column; gap:4px; }
    footer { flex-direction:column; }
  }
  @media (prefers-reduced-motion:no-preference) {
    main { animation:arrive .38s ease-out both; }
    @keyframes arrive { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><i class="mark" aria-hidden="true"></i><span>OMNITONE</span></div>
    <span class="edition">WEB INSTRUMENT</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="title">
      <div>
        <p class="eyebrow">VERSAO WEB</p>
        <h1 id="title">Toque no navegador.</h1>
        <p class="summary">Quatro timbres analogicos de fabrica, prontos para tocar.</p>
      </div>
      <div class="state" id="audioState" role="status"><i aria-hidden="true"></i><span>Audio aguardando</span></div>
    </section>

    <section class="controls" aria-label="Controles do instrumento">
      <label for="preset">Timbre
        <select id="preset">
          <option value="brass">Poly Five - Brass</option>
          <option value="pad">Wide Poly - Pad</option>
          <option value="bass">Chorus Poly - Bass</option>
          <option value="lead">Ladder Mono - Lead</option>
        </select>
      </label>
      <label class="sustain"><input id="sustain" type="checkbox"> Sustain</label>
      <label for="volume">Volume
        <span class="volume"><input id="volume" type="range" min="0" max="100" value="72"><output id="volumeValue">72%</output></span>
      </label>
    </section>

    <section class="keyboard-wrap" aria-label="Teclado musical">
      <div class="keyboard-head"><strong>Teclado</strong><span>C3 - B4</span></div>
      <div class="keyboard" id="keyboard"></div>
      <div class="hint"><span>Multi-touch e acordes</span><span>O audio comeca no primeiro toque</span></div>
    </section>
  </main>

  <footer>
    <span>Omnitone Web · edicao compacta</span>
    <a href="https://helicleiton.github.io/Omnitone/">Voltar ao Omnitone</a>
  </footer>
</div>

<script>
(() => {
  const midiStart = 48;
  const keyboard = document.getElementById('keyboard');
  const presetSelect = document.getElementById('preset');
  const sustainToggle = document.getElementById('sustain');
  const volumeControl = document.getElementById('volume');
  const volumeValue = document.getElementById('volumeValue');
  const audioState = document.getElementById('audioState');
  const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const blackNotes = new Set([1, 3, 6, 8, 10]);
  const pointerNotes = new Map();
  const heldNotes = new Map();
  const voices = new Map();
  const presets = {
    brass: { waves: [['sawtooth', 0, 0.62], ['square', 7, 0.28], ['sawtooth', -7, 0.18]], cutoff: 1700, q: 1.8, attack: 0.018, decay: 0.28, sustain: 0.68, release: 0.28 },
    pad: { waves: [['sawtooth', -14, 0.18], ['sawtooth', -7, 0.2], ['sawtooth', 0, 0.24], ['sawtooth', 7, 0.2], ['triangle', 12, 0.16]], cutoff: 1100, q: 0.7, attack: 0.48, decay: 0.5, sustain: 0.74, release: 0.9 },
    bass: { waves: [['sawtooth', -5, 0.52], ['square', 5, 0.32], ['sine', -1200, 0.24]], cutoff: 520, q: 2.1, attack: 0.008, decay: 0.24, sustain: 0.58, release: 0.18 },
    lead: { waves: [['sawtooth', 0, 0.54], ['square', 9, 0.31], ['sawtooth', 1200, 0.2]], cutoff: 1900, q: 3.2, attack: 0.012, decay: 0.2, sustain: 0.78, release: 0.2 }
  };
  let audio = null;
  let master = null;

  function makeKey(note, index, isBlack) {
    const key = document.createElement('button');
    const pitchClass = note % 12;
    const octave = Math.floor(note / 12) - 1;
    key.type = 'button';
    key.className = 'key' + (isBlack ? ' black' : '');
    key.dataset.note = String(note);
    key.setAttribute('aria-label', noteNames[pitchClass] + octave);
    key.title = noteNames[pitchClass] + octave;
    if (isBlack) {
      key.style.left = ((index + 1) / 14 * 100) + '%';
    } else {
      key.textContent = noteNames[pitchClass] + octave;
      key.style.gridColumn = String(index + 1);
    }
    keyboard.appendChild(key);
  }

  let whiteIndex = 0;
  const whiteColumns = new Map();
  for (let note = midiStart; note < midiStart + 24; note++) {
    const pitchClass = note % 12;
    if (!blackNotes.has(pitchClass)) {
      whiteColumns.set(note, whiteIndex);
      makeKey(note, whiteIndex, false);
      whiteIndex++;
    }
  }
  for (let note = midiStart; note < midiStart + 24; note++) {
    const pitchClass = note % 12;
    if (blackNotes.has(pitchClass)) {
      const precedingWhite = [...whiteColumns.keys()].filter(value => value < note).pop();
      makeKey(note, whiteColumns.get(precedingWhite), true);
    }
  }

  function startAudio() {
    if (!audio) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        audioState.querySelector('span').textContent = 'Audio indisponivel';
        return false;
      }
      audio = new AudioContext();
      master = audio.createGain();
      master.gain.value = Number(volumeControl.value) / 100 * 0.24;
      master.connect(audio.destination);
      audioState.classList.add('ready');
      audioState.querySelector('span').textContent = 'Audio pronto';
    }
    if (audio.state === 'suspended') audio.resume();
    return true;
  }

  function noteOn(note, velocity = 0.82) {
    if (!startAudio() || voices.has(note)) return;
    const patch = presets[presetSelect.value];
    const now = audio.currentTime;
    const filter = audio.createBiquadFilter();
    const envelope = audio.createGain();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(patch.cutoff * 0.45, now);
    filter.frequency.exponentialRampToValueAtTime(Math.max(80, patch.cutoff), now + patch.attack + 0.015);
    filter.Q.value = patch.q;
    envelope.gain.setValueAtTime(0.0001, now);
    envelope.gain.linearRampToValueAtTime(velocity, now + patch.attack);
    envelope.gain.linearRampToValueAtTime(velocity * patch.sustain, now + patch.attack + patch.decay);
    filter.connect(envelope);
    envelope.connect(master);

    const oscillators = patch.waves.map(([type, detune, level]) => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const frequency = 440 * Math.pow(2, (note - 69) / 12);
      oscillator.type = type;
      oscillator.frequency.value = frequency * Math.pow(2, detune / 1200);
      gain.gain.value = level / patch.waves.length;
      oscillator.connect(gain);
      gain.connect(filter);
      oscillator.start(now);
      return oscillator;
    });
    voices.set(note, { envelope, oscillators, patch });
  }

  function noteOff(note) {
    const voice = voices.get(note);
    if (!voice || (sustainToggle.checked && !voice.releasing)) return;
    const now = audio.currentTime;
    voice.releasing = true;
    voice.envelope.gain.cancelScheduledValues(now);
    voice.envelope.gain.setValueAtTime(Math.max(0.0001, voice.envelope.gain.value), now);
    voice.envelope.gain.exponentialRampToValueAtTime(0.0001, now + voice.patch.release);
    voice.oscillators.forEach(oscillator => oscillator.stop(now + voice.patch.release + 0.03));
    window.setTimeout(() => voices.delete(note), (voice.patch.release + 0.1) * 1000);
  }

  function movePointer(pointerId, note) {
    const previous = pointerNotes.get(pointerId);
    if (previous === note) return;
    if (previous !== undefined) {
      const count = (heldNotes.get(previous) || 1) - 1;
      if (count <= 0) {
        heldNotes.delete(previous);
        keyboard.querySelector('[data-note="' + previous + '"]')?.classList.remove('active');
        noteOff(previous);
      } else heldNotes.set(previous, count);
      pointerNotes.delete(pointerId);
    }
    if (note !== null) {
      pointerNotes.set(pointerId, note);
      const count = heldNotes.get(note) || 0;
      heldNotes.set(note, count + 1);
      if (count === 0) {
        keyboard.querySelector('[data-note="' + note + '"]')?.classList.add('active');
        noteOn(note);
      }
    }
  }

  keyboard.addEventListener('pointerdown', event => {
    const key = event.target.closest('[data-note]');
    if (!key) return;
    event.preventDefault();
    key.setPointerCapture(event.pointerId);
    movePointer(event.pointerId, Number(key.dataset.note));
  });
  keyboard.addEventListener('pointermove', event => {
    if (!pointerNotes.has(event.pointerId)) return;
    const key = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-note]');
    movePointer(event.pointerId, key && keyboard.contains(key) ? Number(key.dataset.note) : null);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
    keyboard.addEventListener(type, event => movePointer(event.pointerId, null));
  });

  sustainToggle.addEventListener('change', () => {
    if (sustainToggle.checked) return;
    voices.forEach((voice, note) => {
      if (voice.releasing) return;
      if (!heldNotes.has(note)) noteOff(note);
    });
  });
  volumeControl.addEventListener('input', () => {
    volumeValue.value = volumeControl.value + '%';
    if (master) master.gain.setTargetAtTime(Number(volumeControl.value) / 100 * 0.24, audio.currentTime, 0.02);
  });
  window.addEventListener('blur', () => {
    [...pointerNotes.keys()].forEach(pointerId => movePointer(pointerId, null));
  });
})();
</script>
</body>
</html>
